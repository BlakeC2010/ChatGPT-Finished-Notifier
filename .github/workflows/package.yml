name: Verify and Package Extension on Z-server

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: z-server-ai-chat-notifications
  cancel-in-progress: false

jobs:
  package:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BlakeC2010/ChatGPT-Finished-Notifier
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record tested source
        run: git rev-parse HEAD
      - name: Run full extension suite
        run: node --test
      - name: Package and verify extension ZIP
        id: package
        run: python scripts/package-extension.py
      - name: Upload verified extension
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-notifications-z-server
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
