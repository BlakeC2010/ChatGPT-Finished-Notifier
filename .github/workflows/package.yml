name: Package Extension

on:
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "providers.js"
      - "content-core.js"
      - "content.js"
      - "background-core.js"
      - "background.js"
      - "welcome.html"
      - "welcome.css"
      - "welcome.js"
      - "toast.html"
      - "toast.css"
      - "toast.js"
      - ".github/workflows/package.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Chrome extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./manifest.json').version")
          mkdir -p dist
          rm -f dist/AI-Chat-Notifications-v*.zip dist/AI-Chat-Notifications-latest.zip
          zip -j "dist/AI-Chat-Notifications-v$VERSION.zip" \
            manifest.json \
            providers.js \
            content-core.js \
            content.js \
            background-core.js \
            background.js \
            welcome.html \
            welcome.css \
            welcome.js \
            toast.html \
            toast.css \
            toast.js
          cp "dist/AI-Chat-Notifications-v$VERSION.zip" dist/AI-Chat-Notifications-latest.zip

      - name: Commit packaged ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Package extension ZIP"
          git push
